# Perceptual Compensation Shader Chain - HDR Streaming Content (PQ / ST.2084)
# Same chain order as SDR, swapping SDR modules for HDR variants.
#
# Use this preset when output remains in PQ (HDR passthrough to HDR display).
# If mpv is tone-mapping to SDR for an SDR display, use mpv-vod-preset-sdr.conf
# instead - the tone-mapping converts to gamma space where SDR shaders apply.
#
# To use: include this file from mpv.conf or copy its contents.
#   include="~~/mpv-vod-preset-hdr.conf"

# --- Shader chain ---
glsl-shaders-append="~~/shaders/deband-hdr.glsl"
glsl-shaders-append="~~/shaders/chroma-reconstruct.glsl"
glsl-shaders-append="~~/shaders/antiring.glsl"
glsl-shaders-append="~~/shaders/adaptive-sharpen-hdr.glsl"
glsl-shaders-append="~~/shaders/grain-hdr.glsl"

# --- Disable mpv's built-in debanding ---
deband=no

# --- Scaler settings ---
scale=ewa_lanczossharp
dscale=mitchell
cscale=bilinear
sigmoid-upscaling=yes
correct-downscaling=yes
linear-downscaling=yes

# --- HDR passthrough ---
# Let the display handle HDR tone mapping
target-colorspace-hint=yes
