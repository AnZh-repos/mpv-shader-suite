# Perceptual Compensation Shader Chain - SDR Streaming Content
# Load order is critical: deband -> chroma-reconstruct -> antiring -> sharpen -> grain
#
# Chroma reconstruction replaces mpv's cscale (set cscale=bilinear to avoid
# double-processing). Debanding operates at source resolution before scaling.
# Antiring cleans scaler ringing before the sharpener sees it. Grain is
# cosmetic and must be last so nothing filters it away.
#
# To use: include this file from mpv.conf or copy its contents.
#   include="~~/mpv-vod-preset-sdr.conf"

# --- Shader chain ---
glsl-shaders-append="~~/shaders/deband-sdr.glsl"
glsl-shaders-append="~~/shaders/chroma-reconstruct.glsl"
glsl-shaders-append="~~/shaders/antiring.glsl"
glsl-shaders-append="~~/shaders/adaptive-sharpen-sdr.glsl"
glsl-shaders-append="~~/shaders/grain-sdr.glsl"

# --- Disable mpv's built-in debanding (our shader replaces it) ---
deband=no

# --- Scaler settings ---
# ewa_lanczossharp: high-quality upscaler. Produces some ringing which
# antiring.glsl cleans up - this combination yields sharp + clean results.
scale=ewa_lanczossharp

# mitchell: good general-purpose downscaler, minimal ringing
dscale=mitchell

# bilinear for cscale: our chroma-reconstruct.glsl replaces chroma upsampling.
# Using anything sharper here would double-process and potentially introduce
# ringing in chroma before our shader runs.
cscale=bilinear

# sigmoid-upscaling reduces emphasis of quantization steps during upscaling
# by transforming through a sigmoid curve before scaling and back after.
# Helps prevent banding+ringing interaction the research workbook identifies.
sigmoid-upscaling=yes

# correct-downscaling: use proper windowed sinc for downscaling
correct-downscaling=yes

# linear-downscaling: downscale in linear light to avoid gamma-related
# darkening of thin lines and textures
linear-downscaling=yes
