--script=~~/scripts/stats.lua

# Base settings - always active
vo=gpu-next
gpu-api=vulkan
hwdec=auto-copy
dither-depth=auto

# Scaler defaults (cheap, used outside profiles)
scale=spline36
dscale=hermite
cscale=bilinear
correct-downscaling=no
linear-downscaling=no
sigmoid-upscaling=no

# SDR profile - H.264/AV1 SDR streaming
[sdr-streaming]
profile-cond=get("video-params/gamma", "") ~= "pq" and get("video-params/gamma", "") ~= "hlg"
profile-restore=copy
# Pipeline order: deband at native chroma resolution FIRST, then chroma reconstruct.
# Running deband before chroma-reconstruct means the CHROMA hook sees native 4:2:0
# resolution (half-res) instead of the upscaled full-res output. At 4K SDR this
# reduces work on the chroma deband pass. Chroma-reconstruct also benefits from
# using debanded luma as a cleaner guide signal for edge detection.
glsl-shaders-append="~~/shaders/deband-sdr.glsl"
glsl-shaders-append="~~/shaders/chroma-reconstruct.glsl"
glsl-shaders-append="~~/shaders/antiring.glsl"
glsl-shaders-append="~~/shaders/adaptive-sharpen-sdr.glsl"
glsl-shaders-append="~~/shaders/grain-sdr.glsl"
deband=no
# Quality: 0=Fast  1=Balanced (default)  2=Quality
# Change this line OR press F4/F5/F6 to switch live.
glsl-shader-opts=quality_level=1
scale=spline36
dscale=hermite
cscale=bilinear
sigmoid-upscaling=yes
correct-downscaling=no
linear-downscaling=no

# HDR profile - AV1/HEVC HDR streaming
[hdr-streaming]
profile-cond=get("video-params/gamma", "") == "pq" or get("video-params/gamma", "") == "hlg"
profile-restore=copy
glsl-shaders-append="~~/shaders/deband-hdr.glsl"
glsl-shaders-append="~~/shaders/chroma-reconstruct.glsl"
glsl-shaders-append="~~/shaders/antiring.glsl"
glsl-shaders-append="~~/shaders/adaptive-sharpen-hdr.glsl"
glsl-shaders-append="~~/shaders/grain-hdr.glsl"
deband=no
# Quality: 0=Fast  1=Balanced (default)  2=Quality
glsl-shader-opts=quality_level=1
scale=spline36
dscale=hermite
cscale=bilinear
sigmoid-upscaling=yes
correct-downscaling=no
linear-downscaling=no
target-colorspace-hint=yes
